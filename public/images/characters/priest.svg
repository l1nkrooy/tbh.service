      <stop offset="0%" stop-color="#E0BC4A" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#E0BC4A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="priest-gold" x1="0%" y1="0%" x2="0%" y2="100%">
