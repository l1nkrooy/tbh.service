<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Slayer emblem">
  <defs>
    <linearGradient id="slayer-blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8D5CC" />
      <stop offset="100%" stop-color="#4A4850" />
    </linearGradient>
    <radialGradient id="slayer-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B3B45" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3B3B45" stop-opacity="0" />
    </radialGradient>
  </defs>

  <circle cx="100" cy="100" r="76" fill="url(#slayer-glow)" />

  <!-- Кинжал 1 -->
  <g transform="rotate(45 100 100)">
    <path d="M100 30 L108 92 H92 Z" fill="url(#slayer-blade)" stroke="#1c1b22" stroke-width="1.5" />
    <rect x="93" y="92" width="14" height="10" fill="#2a2930" />
    <rect x="96" y="102" width="8" height="50" rx="2" fill="#2a2930" />
  </g>

  <!-- Кинжал 2 (зеркальный) -->
  <g transform="rotate(-45 100 100)">
    <path d="M100 30 L108 92 H92 Z" fill="url(#slayer-blade)" stroke="#1c1b22" stroke-width="1.5" />
    <rect x="93" y="92" width="14" height="10" fill="#2a2930" />
    <rect x="96" y="102" width="8" height="50" rx="2" fill="#2a2930" />
  </g>

  <circle cx="100" cy="100" r="5" fill="#9c2531" />
</svg>
